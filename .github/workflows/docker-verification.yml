name: Aletheia Docker Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  docker-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Aletheia test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,storage]'

      - name: Parser coverage pre-flight
        run: |
          set -euo pipefail
          PYTHONPATH=app python ci/check_parser_coverage.py | tee ci-parser-preflight.txt

      - name: Verify Docker runtime
        run: |
          set -euo pipefail
          docker --version | tee docker-runtime.txt
          docker info | tee -a docker-runtime.txt

      - name: Build every pinned Aletheia image
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/docker-integration
          bash docker/build.sh 2>&1 | tee ci-artifacts/docker-build.log

      - name: Record image IDs and Dockerfile checksums
        run: |
          set -euo pipefail
          {
            while read -r image; do
              docker image inspect "$image" --format '{{.Id}} {{.Created}}' | sed "s#^#$image #"
            done < <(awk '$1=="docker" && $2=="build" { for(i=1;i<=NF;i++) if($i=="-t") print $(i+1) }' docker/build.sh | sort -u)
            echo '--- Dockerfile SHA256 ---'
            while read -r file; do
              sha256sum "$file"
            done < <(find docker -name Dockerfile -type f | sort)
          } | tee ci-artifacts/image-ids-and-dockerfile-sha256.txt

      - name: Start Phase 14 storage backend services
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name aletheia-postgres \
            -e POSTGRES_PASSWORD=aletheia -e POSTGRES_USER=aletheia -e POSTGRES_DB=aletheia \
            -p 5432:5432 postgres:17-alpine
          docker run -d --name aletheia-redis -p 6379:6379 redis:7-alpine
          docker run -d --name aletheia-neo4j \
            -e NEO4J_AUTH=neo4j/aletheia1234 -p 7687:7687 -p 7474:7474 neo4j:5-community
          docker run -d --name aletheia-elasticsearch \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" -p 9200:9200 elasticsearch:8.19.23
          docker run -d --name aletheia-s3 -p 9090:9090 adobe/s3mock:5.2.3
          {
            echo "ALETHEIA_STORAGE_POSTGRES=postgresql://aletheia:aletheia@localhost:5432/aletheia"
            echo "ALETHEIA_STORAGE_REDIS=redis://localhost:6379/0"
            echo "ALETHEIA_STORAGE_NEO4J=neo4j://neo4j:aletheia1234@localhost:7687"
            echo "ALETHEIA_STORAGE_ELASTICSEARCH=http://localhost:9200"
            echo "ALETHEIA_STORAGE_MINIO=minio://aletheia:aletheia123@localhost:9090"
          } >> "$GITHUB_ENV"

      - name: Wait for storage services to accept connections
        run: |
          set -euo pipefail
          wait_for() {
            name="$1"; attempts="$2"; shift 2
            for i in $(seq 1 "$attempts"); do
              if "$@" >/dev/null 2>&1; then
                echo "$name ready (attempt $i)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready after $attempts attempts" >&2
            docker logs "aletheia-$name" >&2 || true
            return 1
          }
          wait_for postgres 60 docker exec aletheia-postgres pg_isready -U aletheia
          wait_for redis 30 docker exec aletheia-redis redis-cli ping
          wait_for s3 30 curl -fsS http://localhost:9090/
          wait_for elasticsearch 90 curl -fsS http://localhost:9200/_cluster/health
          wait_for neo4j 90 docker exec aletheia-neo4j cypher-shell -u neo4j -p aletheia1234 'RETURN 1'

      - name: Run full test suite (includes all Docker integration tests)
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee ci-artifacts/pytest-full.log

      - name: Capture raw output for every Docker integration case
        if: always()
        run: |
          set -euo pipefail
          python ci/capture_docker_integration.py 2>&1 | tee ci-artifacts/docker-integration/capture.log

      - name: Capture Phase 14 storage conformance
        if: always()
        run: |
          set -euo pipefail
          python ci/storage_conformance.py 2>&1 | tee ci-artifacts/storage-conformance.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aletheia-docker-verification-${{ github.run_id }}
          path: |
            ci-artifacts/
            ci-parser-preflight.txt
            docker-runtime.txt
          if-no-files-found: error
          retention-days: 14

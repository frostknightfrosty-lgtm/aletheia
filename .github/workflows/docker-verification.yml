name: Aletheia Docker Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  docker-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Aletheia test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,storage]'

      - name: Parser coverage pre-flight
        run: |
          set -euo pipefail
          PYTHONPATH=app python ci/check_parser_coverage.py | tee ci-parser-preflight.txt

      - name: Verify Docker runtime
        run: |
          set -euo pipefail
          docker --version | tee docker-runtime.txt
          docker info | tee -a docker-runtime.txt

      - name: Free disk space for the storage service images
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          {
            echo "--- disk before ---"
            df -h /
          } | tee ci-artifacts/disk-space.txt
          # The job builds every Aletheia adapter image, several of which are
          # large (PyTorch-backed). The storage service images add roughly 3 GB,
          # so reclaim the preinstalled SDKs the job never uses.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          docker image prune -f
          {
            echo "--- disk after ---"
            df -h /
          } | tee -a ci-artifacts/disk-space.txt

      - name: Build every pinned Aletheia image
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/docker-integration
          bash docker/build.sh 2>&1 | tee ci-artifacts/docker-build.log

      - name: Record image IDs and Dockerfile checksums
        run: |
          set -euo pipefail
          {
            while read -r image; do
              docker image inspect "$image" --format '{{.Id}} {{.Created}}' | sed "s#^#$image #"
            done < <(awk '$1=="docker" && $2=="build" { for(i=1;i<=NF;i++) if($i=="-t") print $(i+1) }' docker/build.sh | sort -u)
            echo '--- Dockerfile SHA256 ---'
            while read -r file; do
              sha256sum "$file"
            done < <(find docker -name Dockerfile -type f | sort)
          } | tee ci-artifacts/image-ids-and-dockerfile-sha256.txt

      - name: Start Phase 14 storage backend services
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          # Published on loopback with non-default host ports: GitHub-hosted
          # runners ship services that may already own 5432/6379/9200.
          docker run -d --name aletheia-postgres \
            -e POSTGRES_PASSWORD=aletheia -e POSTGRES_USER=aletheia -e POSTGRES_DB=aletheia \
            -p 127.0.0.1:15432:5432 postgres:17-alpine
          docker run -d --name aletheia-redis -p 127.0.0.1:16379:6379 redis:7-alpine
          docker run -d --name aletheia-neo4j \
            -e NEO4J_AUTH=neo4j/aletheia1234 -p 127.0.0.1:17687:7687 -p 127.0.0.1:17474:7474 neo4j:5-community
          docker run -d --name aletheia-elasticsearch \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" -p 127.0.0.1:19200:9200 elasticsearch:8.19.23
          docker run -d --name aletheia-s3 -p 127.0.0.1:19090:9090 adobe/s3mock:5.2.3
          docker ps -a
          {
            echo "ALETHEIA_STORAGE_POSTGRES=postgresql://aletheia:aletheia@127.0.0.1:15432/aletheia"
            echo "ALETHEIA_STORAGE_REDIS=redis://127.0.0.1:16379/0"
            echo "ALETHEIA_STORAGE_NEO4J=neo4j://neo4j:aletheia1234@127.0.0.1:17687"
            echo "ALETHEIA_STORAGE_ELASTICSEARCH=http://127.0.0.1:19200"
            echo "ALETHEIA_STORAGE_MINIO=minio://aletheia:aletheia123@127.0.0.1:19090"
          } >> "$GITHUB_ENV"

      - name: Wait for storage services to accept connections
        run: |
          set -euo pipefail
          wait_for() {
            name="$1"; attempts="$2"; shift 2
            for i in $(seq 1 "$attempts"); do
              if "$@" >/dev/null 2>&1; then
                echo "$name ready (attempt $i)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready after $attempts attempts" >&2
            docker logs "aletheia-$name" >&2 || true
            return 1
          }
          # psql over TCP: the temporary server initdb runs listens on a unix
          # socket only, so this cannot pass before the real server is up, and
          # it proves the real server accepts the credentials the tests use.
          wait_for postgres 60 docker exec -e PGPASSWORD=aletheia aletheia-postgres \
            psql -h 127.0.0.1 -U aletheia -d aletheia -c 'SELECT 1'
          wait_for redis 30 docker exec aletheia-redis redis-cli ping
          # Any HTTP answer means the S3-protocol server is listening; the
          # conformance test itself proves buckets, objects and listings work.
          wait_for s3 30 curl -s -o /dev/null --max-time 3 http://127.0.0.1:19090/
          wait_for elasticsearch 90 curl -fsS http://127.0.0.1:19200/_cluster/health
          wait_for neo4j 90 docker exec aletheia-neo4j cypher-shell -u neo4j -p aletheia1234 'RETURN 1'

      - name: Run full test suite (includes all Docker integration tests)
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          python -m pytest -q -rs --junitxml=ci-artifacts/pytest-junit.xml 2>&1 | tee ci-artifacts/pytest-full.log

      - name: Assert every test executed in CI (no silent skips)
        if: always()
        run: |
          set -euo pipefail
          python ci/pytest_summary.py \
            --junit ci-artifacts/pytest-junit.xml \
            --console ci-artifacts/pytest-full.log \
            --output ci-artifacts/pytest-summary.json

      - name: Capture raw output for every Docker integration case
        if: always()
        run: |
          set -euo pipefail
          python ci/capture_docker_integration.py 2>&1 | tee ci-artifacts/docker-integration/capture.log

      - name: Capture Phase 14 storage conformance
        if: always()
        run: |
          set -euo pipefail
          # --require-all: in CI an unconfigured backend is a failure, not a
          # silent skip. Run 39078543221 reported PASS here while no storage
          # service had actually started.
          python ci/storage_conformance.py --require-all 2>&1 | tee ci-artifacts/storage-conformance.log

      - name: Capture storage service logs (proof the services really ran)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts
          for name in postgres redis neo4j elasticsearch s3; do
            echo "===== aletheia-$name ====="
            docker logs --tail 120 "aletheia-$name" 2>&1 || true
          done > ci-artifacts/storage-service-logs.txt
          cat ci-artifacts/storage-service-logs.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aletheia-docker-verification-${{ github.run_id }}
          path: |
            ci-artifacts/
            ci-parser-preflight.txt
            docker-runtime.txt
          if-no-files-found: error
          retention-days: 14

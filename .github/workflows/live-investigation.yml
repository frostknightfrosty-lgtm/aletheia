name: Aletheia Live Investigation

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Investigation seed, such as username:my_target"
        required: true
        type: string
      authorization_assertion:
        description: "Text describing the legal basis for this investigation"
        required: true
        type: string
      timeout_seconds:
        description: "Timeout for each adapter invocation"
        required: false
        default: 120
        type: number

permissions:
  contents: read

jobs:
  live-investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Aletheia dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify Docker runtime
        run: |
          set -euo pipefail
          docker --version
          docker info

      - name: Build all Aletheia images
        run: |
          set -euo pipefail
          bash docker/build.sh 2>&1 | tee build.log

      - name: Run the investigation
        env:
          ALETHEIA_SEED: ${{ inputs.seed }}
          ALETHEIA_AUTHORIZATION_ASSERTION: ${{ inputs.authorization_assertion }}
          ALETHEIA_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          aletheia investigate \
            --seed "$ALETHEIA_SEED" \
            --legal-only \
            --data-dir ./data \
            --timeout "$ALETHEIA_TIMEOUT_SECONDS" \
            --authorization-assertion "$ALETHEIA_AUTHORIZATION_ASSERTION" \
            2>&1 | tee investigate.log

      - name: Capture run ID
        id: capture-run-id
        run: |
          set -euo pipefail
          RUN_ID="$(python - <<'PY'
          from pathlib import Path
          from uuid import UUID

          for line in Path("investigate.log").read_text(encoding="utf-8").splitlines():
              candidate = line.strip()
              try:
                  parsed = UUID(candidate)
              except ValueError:
                  continue
              if str(parsed) == candidate:
                  print(candidate)
                  break
          else:
              raise SystemExit("No standalone run ID was found in investigate.log")
          PY
          )"
          printf 'run_id=%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Captured run ID: $RUN_ID"

      - name: Generate Phase 2 reports
        env:
          RUN_ID: ${{ steps.capture-run-id.outputs.run_id }}
        run: |
          set -euo pipefail
          aletheia phase2 --run-id "$RUN_ID" --data-dir ./data 2>&1 | tee phase2.log

      - name: Upload live investigation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aletheia-live-${{ github.run_id }}
          path: |
            ./data/
            build.log
            investigate.log
            phase2.log
          if-no-files-found: error

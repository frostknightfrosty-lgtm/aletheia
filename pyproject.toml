[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-osint"
version = "0.7.0"
description = "Provenance-first, checkpointed meta-OSINT orchestration platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.40,<1",
  "SQLAlchemy>=2.0,<3",
  "rapidfuzz==3.14.6",
  "reportlab==5.0.1",
  # Phase 18.3 local-LLM dossier generation. The client is imported lazily so
  # the base CLI starts without an OpenAI-compatible endpoint configured.
  "openai>=1.40,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "pytest-asyncio",
  "pytest-mock",
  "fakeredis>=2.30,<3",
  # Phase 18.3 semantic profile linking. Installed for development/CI, but
  # imported only when a profile pair with usable bio text is compared.
  "sentence-transformers>=2.7.0",
]
# Phase 14 networked storage backends. The file backend is always available;
# these drivers are only needed to talk to PostgreSQL, Neo4j, Elasticsearch,
# MinIO/S3, and Redis.
storage = [
  "pg8000>=1.31,<2",
  "neo4j>=5,<6",
  "elasticsearch>=8,<9",
  "minio>=7.2,<8",
  "redis>=5,<7",
]

[project.scripts]

aletheia = "aletheia.cli.main:main"
aletheia-mcp = "aletheia.mcp.server:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
markers = ["integration: requires built Docker images and optionally network access"]
